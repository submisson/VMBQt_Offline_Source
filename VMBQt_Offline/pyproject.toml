[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vmbqt-offline"
version = "0.1.0"
description = "Native Qt6/PySide6 offline Lanelet2 vector map editor"
readme = "README_zh.md"
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}
dependencies = ["PySide6==6.8.3", "numpy==2.2.6", "pyproj==3.6.1; python_version < '3.11'", "pyproj==3.7.2; python_version >= '3.11'", "PyYAML==6.0.3"]

[project.scripts]
vmbqt = "vmbqt.__main__:main"

[tool.setuptools.packages.find]
include = ["vmbqt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
